[tool.poetry]
name = "gento"
version = "0.1.0"
description = "A lightweight LLM client."
authors = ["Kun Lu <kun.lu.brain@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "gento"}]
repository = "https://github.com/kunlubrain/gento"
homepage = "https://github.com/kunlubrain/gento"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.0.0"
tenacity = "^8.0.0"
aiolimiter = "^1.1.0"
openai = "^1.0.0"
google-genai = "^1.0.0"
python-dotenv = "^1.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
ruff = "^0.16.5"
pyright = "^1.1.411"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["gento", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"