[tool.poetry]
name = "gento"
version = "0.1.0"
description = "A lightweight LLM client."
authors = ["Kun Lu <kun.lu.brain@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "gento"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0.0"
tenacity = "^8.0.0"
aiolimiter = "^1.1.0"
openai = "^1.0.0"
google-genai = "^1.0.0"
python-dotenv = "^1.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
